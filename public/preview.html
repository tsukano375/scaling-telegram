// ── Helpers ───────────────────────────────────────────────
function saveSession(record) {
  state.sessions.unshift(record);
  if (state.sessions.length > 200) state.sessions = state.sessions.slice(0, 200);
  localStorage.setItem("biz_sessions", JSON.stringify(state.sessions));

  const p = state.progress;
  const today = new Date().toISOString().split("T")[0];
  p.totalSessions++;
  if (!p.lastSessionDate) { p.currentStreak = 1; }
  else {
    const diff = Math.floor((new Date(today) - new Date(p.lastSessionDate)) / 86400000);
    if (diff === 1) p.currentStreak++;
    else if (diff > 1) p.currentStreak = 1;
  }
  p.longestStreak = Math.max(p.longestStreak, p.currentStreak);
  p.lastSessionDate = today;

  const cat = record.exercise.category;
  if (!p.categoryScores[cat]) p.categoryScores[cat] = [];
  p.categoryScores[cat].push(record.feedback.score);
  if (p.categoryScores[cat].length > 20) p.categoryScores[cat] = p.categoryScores[cat].slice(-20);

  const tid = record.exercise.techniqueId;
  if (!p.techniqueStats[tid]) p.techniqueStats[tid] = [];
  p.techniqueStats[tid].push(record.feedback.score);

  const existing = p.weeklyScores.find(w => w.date === today);
  if (existing) existing.score = Math.round((existing.score + record.feedback.score) / 2);
  else { p.weeklyScores.push({ date: today, score: record.feedback.score }); p.weeklyScores = p.weeklyScores.slice(-7); }

  localStorage.setItem("biz_progress", JSON.stringify(p));
}

function catBadge(cat) {
  return '<span class="text-xs font-semibold px-2 py-0.5 rounded-full border ' + CAT_COLORS[cat] + '">' + CAT_LABELS[cat] + '</span>';
}
function techniqueBadge(tid) {
  const t = TECHNIQUES[tid];
  return '<span class="text-xs font-semibold px-2 py-0.5 rounded-full border ' + t.tagColor + '">' + t.name + '</span>';
}
function diffBadge(d) {
  return '<span class="text-xs font-semibold ' + DIFF_COLORS[d] + '">' + DIFF_LABELS[d] + '</span>';
}
function avgScore(cat) {
  const arr = state.progress.categoryScores[cat] || [];
  if (!arr.length) return 0;
  return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
}
function scoreColor(s) {
  return s >= 80 ? "text-emerald-600" : s >= 60 ? "text-indigo-600" : s >= 40 ? "text-amber-600" : "text-red-500";
}
function barColor(s) {
  return s >= 80 ? "bg-emerald-400" : s >= 60 ? "bg-indigo-400" : s >= 40 ? "bg-amber-400" : "bg-red-400";
}

// ── Mock Feedback ─────────────────────────────────────────
function mockFeedback(text, ex) {
  const len = text.trim().length;
  if (len < 10) return {
    score: 0, structure: 0, businessness: 0, specificity: 0,
    techniqueUsed: false,
    summary: "もう少し詳しく書いてみましょう。",
    strengths: [],
    improvements: ["内容が短すぎます。具体的な文章を書いてみてください"],
    techTip: null
  };

  const t = TECHNIQUES[ex.techniqueId];
  const hasKeyPhrase = ex.keyPhrases.some(function(kp) { return text.includes(kp); });
  const hasNumbers = /[0-9０-９]/.test(text);
  const hasSpecific = text.length > 80;

  const base = Math.min(45 + Math.floor(len / 4), 80);
  const bonuses = (hasKeyPhrase ? 8 : 0) + (hasNumbers ? 6 : 0) + (hasSpecific ? 6 : 0);
  const score = Math.min(base + bonuses + Math.floor(Math.random() * 10), 100);

  const structure = Math.max(0, Math.min(score + (hasKeyPhrase ? 5 : -5) + Math.floor(Math.random() * 10 - 5), 100));
  const businessness = Math.max(0, Math.min(score + Math.floor(Math.random() * 10 - 3), 100));
  const specificity = Math.max(0, Math.min(score + (hasNumbers ? 8 : -8) + Math.floor(Math.random() * 10 - 5), 100));

  var strengths = [];
  var improvements = [];

  if (hasKeyPhrase) strengths.push(t.name + "の表現パターンが文章に活かされています");
  if (hasNumbers) strengths.push("数字や固有名詞で具体性が出ています");
  if (score >= 70) strengths.push("ビジネス文書として読みやすい構成になっています");
  if (strengths.length === 0) strengths.push("問題に向き合い言語化しようとする姿勢が伝わります");

  if (!hasKeyPhrase) improvements.push(t.name + "のキーフレーズを意識して使ってみましょう");
  if (!hasNumbers) improvements.push("「多い」「早い」などの曖昧表現を数字に置き換えましょう");
  if (score < 70) improvements.push("相手の立場・感情への配慮を一文加えるとより説得力が増します");

  return {
    score: score,
    structure: structure,
    businessness: businessness,
    specificity: specificity,
    techniqueUsed: hasKeyPhrase,
    summary: score >= 75
      ? "ビジネス文書として説得力のある表現ができています。構造化された伝え方が相手に安心感を与えます。"
      : "内容は伝わりますが、さらに構造化と具体性を加えることで、読み手が即座に行動・判断できる文章になります。",
    strengths: strengths,
    improvements: improvements,
    techTip: t.steps[0].label + " → " + t.steps[t.steps.length - 1].label + " の流れを意識してみましょう"
  };
}

          '<p class="text-xs font-semibold text-gray-500 mb-2">模範解答例</p>' +
          '<p class="text-xs text-gray-400 italic mb-2 bg-red-50 rounded-lg px-2 py-1">（NG例）' + ex.badExample + '</p>' +
          '<div class="border-t pt-2"><p class="text-xs font-semibold text-emerald-700 mb-1">（OK例）</p><p class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">' + ex.goodExample + '</p></div>' +
        '</div>' +
        '<button onclick="backToSelect()" class="w-full py-3 rounded-2xl bg-slate-900 text-white font-semibold text-base hover:bg-slate-700 transition-all">次の問題へ</button>' +
      '</div>' +
    '</div>';
  }
}

// ── Page: History ─────────────────────────────────────────
function renderHistory() {
  if (!state.sessions.length) {
    return '<div class="flex flex-col fade-in"><div class="px-6 pt-10 pb-4"><h2 class="text-2xl font-black text-gray-900">練習履歴</h2><p class="text-sm text-gray-400 mt-1">0回のセッション</p></div><div class="flex flex-col items-center justify-center py-24 px-6 text-center"><p class="text-gray-500 text-sm">まだ練習を完了していません。<br>「練習」タブから始めましょう。</p></div></div>';
  }

  var grouped = {};
  state.sessions.forEach(function(s) {
    const d = s.completedAt.split("T")[0];
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(s);
  });
  const sortedDates = Object.keys(grouped).sort(function(a, b) { return b.localeCompare(a); });

  var html = sortedDates.map(function(date) {
    const label = new Date(date + "T12:00:00").toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
    var items = grouped[date].map(function(rec, i) {
      const sc = rec.feedback.score;
      const col = scoreColor(sc);
      const rid = "rec-" + date + "-" + i;
      const d = new Date(rec.completedAt);
      const timeStr = d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      var subBars = [["構造性", rec.feedback.structure], ["ビジネス度", rec.feedback.businessness], ["具体性", rec.feedback.specificity]].map(function(item) {
        return '<div class="bg-gray-50 rounded-xl py-2"><p class="text-lg font-bold text-gray-800">' + item[1] + '</p><p class="text-xs text-gray-400">' + item[0] + '</p></div>';
      }).join("");
      return '<div class="border border-gray-100 rounded-2xl overflow-hidden">' +
        '<button onclick="toggleRecord(\'' + rid + '\')" class="w-full text-left p-4 flex items-start gap-3 hover:bg-gray-50 transition-colors">' +
          '<div class="flex-1 flex flex-col gap-1"><div class="flex items-center gap-2 flex-wrap">' + catBadge(rec.exercise.category) + techniqueBadge(rec.exercise.techniqueId) + '</div><p class="text-sm font-semibold text-gray-900">' + rec.exercise.title + '</p><p class="text-xs text-gray-400">' + timeStr + ' · ' + rec.durationSeconds + '秒</p></div>' +
          '<div class="flex flex-col items-end gap-1"><span class="' + col + ' text-2xl font-black">' + sc + '</span><span class="text-xs text-gray-400">/ 100</span></div>' +
        '</button>' +
        '<div id="' + rid + '" class="hidden border-t border-gray-100 px-4 pb-4 pt-3 flex flex-col gap-3">' +
          '<div><p class="text-xs text-gray-400 mb-1">シナリオ</p><p class="text-sm text-gray-700">' + rec.exercise.prompt + '</p></div>' +
          '<div><p class="text-xs text-gray-400 mb-1">あなたの回答</p><p class="text-sm text-gray-700 whitespace-pre-wrap bg-gray-50 rounded-xl p-3">' + rec.userResponse + '</p></div>' +
          '<div><p class="text-xs text-gray-400 mb-1">フィードバック</p><p class="text-sm text-gray-700">' + rec.feedback.summary + '</p></div>' +
          '<div class="grid grid-cols-3 gap-2 text-center">' + subBars + '</div>' +
        '</div>' +
      '</div>';
    }).join("");
    return '<div class="flex flex-col gap-3"><h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wide">' + label + '</h3>' + items + '</div>';
  }).join("");

  return '<div class="flex flex-col fade-in"><div class="px-6 pt-10 pb-4"><h2 class="text-2xl font-black text-gray-900">練習履歴</h2><p class="text-sm text-gray-400 mt-1">' + state.sessions.length + '回のセッション</p></div><div class="px-6 flex flex-col gap-6 pb-6">' + html + '</div></div>';
}

// ── Actions ───────────────────────────────────────────────
function showPage(page) {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.page = page;
  render();
  ["home", "practice", "guide", "history"].forEach(function(p) {
    const el = document.getElementById("nav-" + p);
    if (!el) return;
    el.className = el.className.replace("text-indigo-600", "text-gray-400");
  });
  const active = document.getElementById("nav-" + page);
  if (active) active.className = active.className.replace("text-gray-400", "text-indigo-600");
}

function selectEx(id) {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.selectedEx = EXERCISES.find(function(e) { return e.id === id; });
  state.userText = ""; state.elapsed = 0; state.feedback = null; state.showHint = false;
  state.phase = "ready";
  state.page = "practice";
  render();
  ["home", "practice", "guide", "history"].forEach(function(p) {
    const el = document.getElementById("nav-" + p);
    if (el) el.className = el.className.replace("text-indigo-600", "text-gray-400");
  });
  const active = document.getElementById("nav-practice");
  if (active) active.className = active.className.replace("text-gray-400", "text-indigo-600");
}

function startWriting() {
  state.phase = "writing";
  state.elapsed = 0;
  render();
  document.getElementById("user-text") && document.getElementById("user-text").focus();
  state.timerInterval = setInterval(function() {
    state.elapsed++;
    const ex = state.selectedEx;
    const remaining = ex.timeLimit - state.elapsed;
    const pct = (state.elapsed / ex.timeLimit) * 100;
    const urgent = remaining <= 30;
    const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
    const ss = String(remaining % 60).padStart(2, "0");
    const display = document.getElementById("timer-display");
    const bar = document.getElementById("timer-bar");
    if (display) { display.textContent = mm + ":" + ss; display.className = "text-3xl font-mono font-bold tabular-nums " + (urgent ? "text-red-500" : "text-gray-700"); }
    if (bar) { bar.style.width = pct + "%"; bar.className = "h-full rounded-full " + (urgent ? "bg-red-400" : "bg-indigo-500"); }
    if (remaining <= 0) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
      if (state.userText.trim().length > 0) submitAnswer();
    }
  }, 1000);
}

function submitAnswer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  if (!state.userText.trim()) return;
  state.phase = "submitting";
  render();
  setTimeout(function() {
    const fb = mockFeedback(state.userText, state.selectedEx);
    state.feedback = fb;
    const record = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2),
      exerciseId: state.selectedEx.id,
      exercise: state.selectedEx,
      userResponse: state.userText,
      feedback: fb,
      completedAt: new Date().toISOString(),
      durationSeconds: state.elapsed,
    };
    saveSession(record);
    state.phase = "feedback";
    render();
  }, 1500);
}

function backToSelect() {
  state.phase = "select"; state.selectedEx = null; state.userText = ""; state.feedback = null; state.elapsed = 0;
  render();
}

function toggleRecord(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle("hidden");
}

// ── Render ────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  if (state.page === "home") app.innerHTML = renderHome();
  else if (state.page === "practice") app.innerHTML = renderPractice();
  else if (state.page === "guide") app.innerHTML = renderGuide();
  else if (state.page === "history") app.innerHTML = renderHistory();
  if (state.phase === "writing") {
    const ta = document.getElementById("user-text");
    if (ta) {
      ta.value = state.userText;
      ta.oninput = function(e) {
        state.userText = e.target.value;
        const cc = document.getElementById("char-count");
        if (cc) cc.textContent = e.target.value.length + "文字";
      };
    }
  }
}

render();
</script>
</body>
</html>
